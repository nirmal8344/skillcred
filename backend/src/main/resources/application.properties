spring.application.name=skillcred

# Environment identifier — set to "production" on Render
# Controls fail-fast behavior for missing secrets
skillcred.env=${SKILLCRED_ENV:development}

# Server port — Render sets PORT automatically
server.port=${PORT:8080}

# Database — REQUIRED in production (no usable fallback)
# In development, falls back to local PostgreSQL defaults
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/skillcred_db}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jackson.serialization.fail-on-empty-beans=false

spring.flyway.enabled=false

# CORS allowed origins — set to your Vercel domain in production
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}